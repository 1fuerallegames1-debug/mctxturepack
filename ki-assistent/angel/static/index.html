<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Angel">
<script>
  // Manifest mit Zugangsschlüssel, damit die App auf dem Startbildschirm (iPhone/Android) ohne neues Scannen startet
  (function () {
    var m = location.hash.match(/token=([\w-]+)/), t = m && m[1];
    try { t = t || localStorage.getItem("angel-token"); } catch (e) {}
    var l = document.createElement("link"); l.rel = "manifest";
    l.href = "/manifest.webmanifest" + (t ? "?token=" + encodeURIComponent(t) : "");
    document.head.appendChild(l);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Angel</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #66707c; --border: #dde1e6;
    --accent: #4f46e5; --accent-text: #ffffff; --user: #e9e7fd; --tool: #f3f1fa; --tool-border: #d9d2f2;
    --ok: #1d8a4a; --err: #c23b3b; --warn-bg: #fff7e0; --warn-border: #f0c75e; --danger-bg: #fdecec;
    --code-bg: #f0f2f5; --shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --panel: #1d2126; --text: #e6e9ed; --muted: #98a2ad; --border: #30363d;
      --accent: #8b85ff; --accent-text: #0d1117; --user: #2a2750; --tool: #231f33; --tool-border: #3d3460;
      --ok: #4cc27c; --err: #f07070; --warn-bg: #3a3218; --warn-border: #8a7330; --danger-bg: #3d1f1f;
      --code-bg: #262b31;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
           background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 26px; height: 26px; border-radius: 7px; }
  header h1 small { color: var(--muted); font-weight: normal; font-size: 13px; }
  select, button, textarea { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; max-width: 200px; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; min-height: 34px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  button.icon { padding: 6px 9px; }
  button.icon.on { border-color: var(--accent); background: var(--user); }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  label.toggle.on { color: var(--err); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .chat { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--border); }
  .msg.assistant p { margin: 0 0 8px; } .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.error { background: var(--danger-bg); color: var(--err); white-space: pre-wrap; }
  .msg.info { color: var(--muted); font-size: 13px; text-align: center; padding: 2px; }
  .msg pre, details pre, .approval pre { background: var(--code-bg); padding: 8px 10px; border-radius: 8px; overflow-x: auto;
          white-space: pre-wrap; font: 13px/1.45 ui-monospace, Consolas, "Cascadia Mono", monospace; margin: 6px 0; max-height: 60vh; overflow-y: auto; }
  .msg code { background: var(--code-bg); padding: 1px 5px; border-radius: 5px; font: 13px ui-monospace, Consolas, monospace; }
  .msg pre code { background: none; padding: 0; }
  .msg h2, .msg h3, .msg h4 { margin: 10px 0 6px; font-size: 16px; }
  .msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
  .msg table { border-collapse: collapse; margin: 6px 0; font-size: 14px; display: block; overflow-x: auto; }
  .msg td, .msg th { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg a { color: var(--accent); }
  details.tool { background: var(--tool); border: 1px solid var(--tool-border); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  details.tool summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool .name { font-weight: 600; white-space: nowrap; }
  details.tool .short { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  details.tool .state { white-space: nowrap; }
  details.tool .state.ok { color: var(--ok); } details.tool .state.error, details.tool .state.denied { color: var(--err); }
  details.thinking { color: var(--muted); font-size: 13px; }
  details.thinking summary { cursor: pointer; }
  details.thinking div { white-space: pre-wrap; border-left: 3px solid var(--border); padding-left: 10px; margin-top: 4px; }
  .approval { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 12px; padding: 12px 14px; }
  .approval.dangerous { background: var(--danger-bg); border-color: var(--err); }
  .approval .title { font-weight: 600; margin-bottom: 4px; }
  .approval .buttons { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .approval .buttons button { min-height: 42px; }
  .approval.done { opacity: .65; }
  footer { padding: 12px 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--border); }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 200px; padding: 11px 12px; border-radius: 12px;
             border: 1px solid var(--border); background: var(--bg); font-size: 16px; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  footer button.send { height: 46px; padding: 0 18px; border-radius: 12px; }
  .hint { max-width: 860px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  .status { max-width: 860px; margin: 0 auto 6px; color: var(--muted); font-size: 12px; text-align: center; }
  .welcome { text-align: center; color: var(--muted); margin-top: 6vh; }
  .welcome h2 { color: var(--text); margin-bottom: 4px; }
  .welcome img { width: 72px; height: 72px; border-radius: 18px; }
  .rules { display: inline-block; text-align: left; margin: 10px auto 0; padding: 10px 16px; border: 1px solid var(--border);
           border-radius: 12px; background: var(--panel); font-size: 13px; max-width: 520px; }
  .rules b { color: var(--text); }
  .rules ol { margin: 4px 0 0; padding-left: 20px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .examples button { font-size: 14px; border-radius: 999px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  dialog { border: none; border-radius: 16px; padding: 20px; background: var(--panel); color: var(--text); box-shadow: var(--shadow);
           max-width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin-top: 0; }
  dialog img { display: block; width: 100%; max-width: 280px; margin: 10px auto; border-radius: 8px; image-rendering: pixelated; }
  dialog code { font-size: 12px; overflow-wrap: anywhere; }
  dialog .close { float: right; }
  @media (max-width: 640px) {
    header { padding: 8px 10px; gap: 6px; } main { padding: 10px; } footer { padding: 8px 10px 10px; }
    header h1 small, .hint, #autoText { display: none; }
    select { max-width: 130px; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="/icon.svg" alt=""><span id="title">Angel</span> <small>deine KI</small></h1>
  <select id="model" title="KI-Modell" aria-label="KI-Modell"></select>
  <label class="toggle" id="autoLabel" title="Aktionen ohne Nachfrage ausführen">
    <input type="checkbox" id="auto"> <span id="autoText">Automatik</span>
  </label>
  <button class="icon" id="speak" title="Antworten vorlesen" aria-label="Antworten vorlesen">🔈</button>
  <button class="icon" id="phone" title="Handy verbinden" aria-label="Handy verbinden">📱</button>
  <button id="newChat" title="Neues Gespräch beginnen">Neu</button>
</header>
<main id="main"><div class="chat" id="chat"></div></main>
<footer>
  <div class="status" id="status" hidden></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Schreib Angel, was zu tun ist …" aria-label="Nachricht"></textarea>
    <button type="submit" class="primary send" id="send">Senden</button>
  </form>
  <div class="hint">Enter = senden · Shift+Enter = neue Zeile · Aktionen am PC werden erst nach deiner Erlaubnis ausgeführt</div>
</footer>
<dialog id="phoneDialog"></dialog>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chat = $("chat"), main = $("main"), input = $("input"), sendBtn = $("send"), statusEl = $("status");
const isTouch = window.matchMedia("(pointer: coarse)").matches;
let token = "", busy = false, assistantName = "Angel", rules = [];
let currentRun = null;           // { id, since } der Aufgabe, deren Ereignisse gerade angezeigt werden
let speakOn = false;

// ---------- Speicher (kann im privaten Modus fehlen) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ---------- Zugangsschlüssel ----------
(function initToken() {
  const m = location.hash.match(/token=([\w-]+)/);
  // Der Schlüssel bleibt in der Adresse (#token=…), damit "Zum Startbildschirm hinzufügen" ihn mitnimmt.
  if (m) store.set("angel-token", m[1]);
  token = (m && m[1]) || store.get("angel-token") || "";
})();

class HttpError extends Error { constructor(msg, status) { super(msg); this.status = status; } }

async function api(path, body) {
  const opts = { method: body === undefined ? "GET" : "POST", headers: { "X-Angel-Token": token }, cache: "no-store" };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(path, opts); }
  catch (e) {
    throw new HttpError("Keine Verbindung zu " + assistantName + ". Läuft am PC noch das schwarze Fenster " +
                        "(start-web.bat / start-handy.bat)? Ist das Gerät im selben WLAN?", 0);
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { store.del("angel-token"); }
  if (!res.ok) throw new HttpError(data.error || ("HTTP " + res.status), res.status);
  return data;
}

// ---------- Sichere Mini-Markdown-Darstellung ----------
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function inline(s) {
  // s ist bereits HTML-escaped
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
}
function markdown(src) {
  const lines = esc(src).split("\n");
  let html = "", i = 0;
  const isList = (l) => /^\s*([-*•]|\d+[.)])\s+/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; html += `<pre><code>${buf.join("\n")}</code></pre>`; continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const lvl = Math.min(4, h[1].length + 1); html += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      html += "<table><tr>" + cells(line).map((c) => `<th>${c}</th>`).join("") + "</tr>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        html += "<tr>" + cells(lines[i]).map((c) => `<td>${c}</td>`).join("") + "</tr>"; i++;
      }
      html += "</table>"; continue;
    }
    if (isList(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      html += ordered ? "<ol>" : "<ul>";
      while (i < lines.length && isList(lines[i])) {
        html += "<li>" + inline(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, "")) + "</li>"; i++;
      }
      html += ordered ? "</ol>" : "</ul>"; continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*```/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !isList(lines[i])) {
      para.push(inline(lines[i])); i++;
    }
    html += `<p>${para.join("<br>")}</p>`;
  }
  return html;
}

// ---------- Vorlesen (Sprachausgabe des Browsers, Deutsch oder Englisch) ----------
function guessLang(text) {
  const t = " " + text.toLowerCase() + " ";
  let de = (t.match(/[äöüß]/g) || []).length * 2, en = 0;
  for (const w of [" der ", " die ", " und ", " ist ", " nicht ", " ich ", " du ", " das ", " ein ", " mit "]) if (t.includes(w)) de++;
  for (const w of [" the ", " and ", " is ", " not ", " you ", " this ", " with ", " are ", " for ", " it "]) if (t.includes(w)) en++;
  return en > de ? "en" : "de";
}
function speak(text) {
  if (!speakOn || !("speechSynthesis" in window) || !text) return;
  const clean = text.replace(/```[\s\S]*?```/g, " (Code) ").replace(/https?:\/\/\S+/g, " ")
                    .replace(/[*_#`>|]/g, " ").replace(/\s+/g, " ").trim();
  if (!clean) return;
  const lang = guessLang(clean);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = lang === "en" ? "en-US" : "de-DE";
  const voice = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith(lang));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
function updateSpeakButton() {
  $("speak").textContent = speakOn ? "🔊" : "🔈";
  $("speak").classList.toggle("on", speakOn);
  $("speak").title = speakOn ? "Vorlesen ist an" : "Antworten vorlesen";
}
$("speak").onclick = () => {
  if (!("speechSynthesis" in window)) { addInfo("Dieser Browser kann leider nicht vorlesen."); return; }
  speakOn = !speakOn; store.set("angel-speak", speakOn ? "1" : "0"); updateSpeakButton();
  if (speakOn) speak(assistantName === "Angel" ? "Hallo, ich lese dir meine Antworten vor." : "Vorlesen ist an.");
  else speechSynthesis.cancel();
};

// ---------- Anzeige ----------
function scrollDown(force) {
  const near = main.scrollHeight - main.scrollTop - main.clientHeight < 160;
  if (force || near) main.scrollTop = main.scrollHeight;
}
function add(el) { const w = $("welcome"); if (w) w.remove(); chat.appendChild(el); scrollDown(true); return el; }
function div(cls, text) { const d = document.createElement("div"); d.className = cls; if (text !== undefined) d.textContent = text; return d; }
function addUser(text) { add(div("msg user", text)); }
function addAssistant(text) { const d = div("msg assistant"); d.innerHTML = markdown(text); return add(d); }
function addError(text) { add(div("msg error", text)); }
function addInfo(text) { add(div("msg info", text)); }
function setStatus(text) { statusEl.textContent = text || ""; statusEl.hidden = !text; }

function stateLabel(status) {
  return { ok: "✓ erledigt", denied: "✗ abgelehnt", cancelled: "✗ abgebrochen" }[status] || "✗ Fehler";
}
function addTool(name, summary, result, status) {
  const d = document.createElement("details");
  d.className = "tool";
  const s = document.createElement("summary");
  const n = div("name", "⚙ " + name); n.style.display = "inline";
  const short = div("short", (summary || "").split("\n").slice(0, 2).join(" · "));
  const st = div("state" + (status ? " " + status : ""), status ? stateLabel(status) : "läuft …");
  s.append(n, short, st);
  const args = document.createElement("pre"); args.textContent = summary || ""; if (!summary) args.hidden = true;
  const res = document.createElement("pre"); res.textContent = result || ""; if (!result) res.hidden = true;
  d.append(s, args, res);
  d._state = st; d._result = res;
  return add(d);
}

function showWelcome() {
  chat.innerHTML = "";
  const w = div("welcome"); w.id = "welcome";
  w.innerHTML = `<img src="/icon-192.png" alt=""><h2>Hallo! Ich bin ${esc(assistantName)}.</h2>` +
    `<p>Ich laufe auf deinem PC und erledige Dinge für dich – auf Deutsch oder Englisch.</p>`;
  if (rules.length) {
    const r = div("rules");
    r.innerHTML = "<b>Meine Grundregeln</b><ol>" + rules.map((x) => `<li>${esc(x)}</li>`).join("") + "</ol>";
    w.appendChild(r);
  }
  const ex = div("examples");
  ["Was ist auf meinem Desktop?", "Wie viel Speicherplatz habe ich noch frei?", "Was gibt es heute für Nachrichten?",
   "Öffne den Rechner", "What's the weather like in Berlin?", "Merk dir, dass ich gerne Minecraft spiele"].forEach((t) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = t;
    b.onclick = () => { input.value = t; send(); };
    ex.appendChild(b);
  });
  w.appendChild(ex);
  chat.appendChild(w);
}

// ---------- Nachfrage (Erlauben / Ablehnen) ----------
const approvals = {};
function addApproval(ev) {
  const box = div("approval" + (ev.dangerous ? " dangerous" : ""));
  box.appendChild(div("title", ev.dangerous ? `⚠ ${assistantName} möchte etwas möglicherweise Gefährliches tun:` : `${assistantName} möchte Folgendes tun:`));
  const pre = document.createElement("pre"); pre.textContent = ev.summary; box.appendChild(pre);
  if (ev.warning) { const w = div("title", ev.warning); w.style.color = "var(--err)"; box.appendChild(w); }
  const buttons = div("buttons");
  const decide = async (decision) => {
    buttons.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try { await api("/api/approve", { approval_id: ev.approval_id, decision }); }
    catch (e) { buttons.querySelectorAll("button").forEach((b) => (b.disabled = false));
                if (e.status !== 404) addError("Antwort konnte nicht gesendet werden: " + e.message); }
  };
  const yes = document.createElement("button"); yes.className = "primary"; yes.textContent = "Erlauben";
  yes.onclick = () => decide("yes");
  buttons.appendChild(yes);
  if (ev.always_label !== null && ev.always_label !== undefined && !ev.dangerous) {
    const always = document.createElement("button");
    always.textContent = ev.always_label ? `Immer für ${ev.always_label} (diese Sitzung)` : "Immer erlauben (diese Sitzung)";
    always.onclick = () => decide("always");
    buttons.appendChild(always);
  }
  const no = document.createElement("button"); no.className = "danger"; no.textContent = "Ablehnen";
  no.onclick = () => decide("no");
  buttons.appendChild(no);
  box.appendChild(buttons);
  approvals[ev.approval_id] = box;
  add(box);
  if (!isTouch) yes.focus();
  if (navigator.vibrate) { try { navigator.vibrate(150); } catch (e) {} }
}
function closeApproval(id, decision) {
  const box = approvals[id];
  if (!box) return;
  box.classList.add("done");
  const label = decision === "yes" ? "✓ erlaubt" : decision === "always" ? "✓ für diese Sitzung immer erlaubt" : "✗ abgelehnt";
  box.querySelector(".buttons").replaceChildren(div("", label));
  delete approvals[id];
}

// ---------- Ereignisse einer Aufgabe anzeigen ----------
function makeRenderer(replay) {
  let bubble = null, bubbleText = "", dirty = false, thinking = null, thinkingText = "";
  const tools = {}, openTools = new Set();
  const endThinking = () => { if (thinking) { thinking.firstChild.textContent = "💭 Gedanken"; thinking = null; } };
  const flush = () => { if (bubble && dirty) { bubble.innerHTML = markdown(bubbleText); dirty = false; scrollDown(); } };
  const finishBubble = () => { flush(); if (bubble) bubble.classList.remove("cursor"); bubble = null; bubbleText = ""; };
  const abortOpenTools = () => {
    openTools.forEach((id) => { const t = tools[id]; t._state.textContent = stateLabel("cancelled"); t._state.className = "state cancelled"; });
    openTools.clear();
  };
  return {
    flush,
    handle(ev) {
      switch (ev.type) {
        case "user": if (replay) addUser(ev.text); break;
        case "thinking":
          if (!thinking) {
            thinking = document.createElement("details"); thinking.className = "thinking";
            thinking.innerHTML = "<summary>💭 denkt nach …</summary><div></div>"; add(thinking); thinkingText = "";
          }
          thinkingText += ev.text; thinking.lastChild.textContent = thinkingText; break;
        case "text":
          endThinking();
          if (!bubble) { bubble = addAssistant(""); bubble.classList.add("cursor"); }
          bubbleText += ev.text; dirty = true; break;   // gezeichnet wird einmal pro Paket (flush)
        case "assistant":
          endThinking(); finishBubble();
          if (!replay) speak(ev.content);
          break;
        case "tool_start": finishBubble(); tools[ev.id] = addTool(ev.name, ev.summary, "", null); openTools.add(ev.id); break;
        case "tool_result": {
          const t = tools[ev.id] || addTool(ev.name, "", "", null);
          openTools.delete(ev.id);
          t._state.textContent = stateLabel(ev.status); t._state.className = "state " + ev.status;
          t._result.textContent = ev.result; t._result.hidden = !ev.result; scrollDown(); break;
        }
        case "approval": addApproval(ev); break;
        case "approval_done": closeApproval(ev.approval_id, ev.decision); break;
        case "error": finishBubble(); addError(ev.message); break;
        case "info": addInfo(ev.message); break;
        case "cancelled": finishBubble(); abortOpenTools(); addInfo("Abgebrochen."); break;
      }
    },
    finish() {
      endThinking(); finishBubble(); abortOpenTools();
      Object.keys(approvals).forEach((id) => closeApproval(id, "no"));
    },
  };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Holt neue Ereignisse, bis die Aufgabe fertig ist. Übersteht Verbindungsabbrüche (z. B. Handy-Display aus).
async function follow(runId, replay) {
  const renderer = makeRenderer(replay);
  currentRun = { id: runId, since: 0 };
  setBusy(true);
  let failures = 0;
  try {
    for (;;) {
      if (!currentRun || currentRun.id !== runId) return;
      let data;
      try {
        data = await api(`/api/events?run=${runId}&since=${currentRun.since}`);
        failures = 0; setStatus("");
      } catch (e) {
        if (e.status === 404 || e.status === 401) { if (e.status === 401) showNoToken(); break; }
        failures++;
        setStatus("Verbindung unterbrochen – versuche es erneut …");
        await sleep(Math.min(10000, 500 * 2 ** Math.min(failures, 5)));
        continue;
      }
      for (const ev of data.events) renderer.handle(ev);
      renderer.flush();
      currentRun.since = data.next;
      if (data.done) break;
    }
  } finally {
    renderer.finish();
    if (currentRun && currentRun.id === runId) { currentRun = null; setBusy(false); setStatus(""); }
  }
}

// Läuft gerade eine Aufgabe (z. B. am PC gestartet), die diese Seite noch nicht anzeigt? Dann anzeigen.
async function attachIfRunning() {
  if (!token || currentRun) return;
  try {
    const st = await api("/api/status");
    if (st.run && !st.run.done && !currentRun) {
      addInfo("Eine Aufgabe läuft gerade – sie wird hier angezeigt.");
      follow(st.run.id, true);
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") attachIfRunning(); });

// ---------- Senden ----------
function setBusy(b) {
  busy = b;
  sendBtn.textContent = b ? "Stopp" : "Senden";
  sendBtn.className = (b ? "danger" : "primary") + " send";
}

async function send() {
  if (busy) { try { await api("/api/stop", {}); } catch (e) {} return; }
  const text = input.value.trim();
  if (!text) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  input.value = ""; autosize();
  const bubble = add(div("msg user", text));
  setBusy(true);
  let r;
  try {
    r = await api("/api/chat", { text });
  } catch (e) {
    setBusy(false);
    if (e.status === 401) { showNoToken(); return; }
    bubble.remove();
    if (!input.value) { input.value = text; autosize(); }   // Text nicht verlieren
    addError(e.message || String(e));
    if (e.status === 409) attachIfRunning();                 // auf einem anderen Gerät gestartete Aufgabe anzeigen
    return;
  }
  try {
    await follow(r.run, false);
  } finally {
    if (!isTouch) input.focus();
  }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(200, input.scrollHeight + 2) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !isTouch) { e.preventDefault(); if (!busy) send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });

$("newChat").onclick = async () => {
  if (busy) { addInfo("Bitte erst die laufende Aufgabe stoppen."); return; }
  try { await api("/api/reset", {}); showWelcome(); } catch (e) { addError(e.message); }
};

$("auto").onchange = async (e) => {
  const on = e.target.checked;
  if (on && !confirm("Automatik einschalten?\n\n" + assistantName + " führt dann Befehle, Programme und Dateiänderungen OHNE Rückfrage aus. " +
                      "Nur gefährliche Befehle (z. B. Löschen ganzer Ordner) werden noch nachgefragt.")) {
    e.target.checked = false; return;
  }
  try { const r = await api("/api/settings", { auto: on }); updateAuto(r.auto); }
  catch (err) { e.target.checked = !on; addError(err.message); }
};
function updateAuto(on) { $("auto").checked = on; $("autoLabel").classList.toggle("on", on); }

$("model").onchange = async (e) => {
  try { const r = await api("/api/settings", { model: e.target.value }); addInfo("Modell gewechselt: " + r.model); }
  catch (err) { addError(err.message); loadModels(); }
};

async function loadModels() {
  const sel = $("model");
  try {
    const r = await api("/api/models");
    sel.replaceChildren();
    const list = r.models.length ? r.models.slice() : [r.current];
    if (!list.includes(r.current) && !list.includes(r.current + ":latest")) list.unshift(r.current);
    list.forEach((m) => {
      const o = document.createElement("option"); o.value = m; o.textContent = m;
      if (m === r.current || m === r.current + ":latest") o.selected = true;
      sel.appendChild(o);
    });
  } catch (e) { sel.replaceChildren(); const o = document.createElement("option"); o.textContent = "Modell?"; sel.appendChild(o); }
}

// ---------- Handy verbinden ----------
$("phone").onclick = async () => {
  const dlg = $("phoneDialog");
  dlg.replaceChildren();
  const close = document.createElement("button"); close.className = "close"; close.textContent = "✕"; close.onclick = () => dlg.close();
  dlg.append(close);
  const h = document.createElement("h3"); h.textContent = "📱 Handy verbinden"; dlg.append(h);
  try {
    const p = await api("/api/pairing");
    if (p.enabled) {
      dlg.append(div("", "Handy ins selbe WLAN wie den PC, dann den Code mit der Handy-Kamera scannen:"));
      const img = document.createElement("img"); img.src = p.qr; img.alt = "QR-Code"; dlg.append(img);
      const c = document.createElement("code"); c.textContent = p.url; dlg.append(c);
      dlg.append(div("hint", "Tipp: Im Handy-Browser „Zum Startbildschirm hinzufügen“ – dann ist " + assistantName +
                     " wie eine App erreichbar. Den Link nicht weitergeben: Wer ihn hat, kann " + assistantName + " Aufträge geben."));
    } else {
      dlg.append(div("", "Der Handy-Zugriff ist gerade aus. Beende " + assistantName +
                     " und starte sie mit „start-handy.bat“ (bzw. ./start.sh --handy). Dann erscheint hier ein QR-Code zum Scannen."));
    }
  } catch (e) { dlg.append(div("msg error", e.message)); }
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
};

function showNoToken() {
  showWelcome();
  addError("Kein gültiger Zugangsschlüssel. Am PC: " + assistantName + " über start-web.bat bzw. start-handy.bat starten " +
           "(der Browser öffnet sich mit dem richtigen Link). Am Handy: den QR-Code aus dem PC-Fenster scannen.");
}

async function init() {
  speakOn = store.get("angel-speak") === "1" && "speechSynthesis" in window;
  updateSpeakButton();
  if (!token) { showNoToken(); return; }
  try {
    const st = await api("/api/status");
    assistantName = st.name; rules = st.rules || [];
    document.title = st.name;
    $("title").textContent = st.name;
    input.placeholder = "Schreib " + st.name + ", was zu tun ist …";
    updateAuto(st.auto);
    const h = await api("/api/history");
    if (!h.items.length && !(st.run && !st.run.done)) showWelcome(); else chat.replaceChildren();
    (st.plugin_errors || []).forEach((m) => addError(m));
    for (const it of h.items) {
      if (it.role === "user") addUser(it.text);
      else if (it.role === "assistant") addAssistant(it.text);
      else if (it.role === "tool") addTool(it.name, it.summary, it.result, it.status || "ok");
    }
    loadModels();
    if (st.run && !st.run.done) follow(st.run.id, true);   // laufende Aufgabe weiter anzeigen
  } catch (e) {
    if (e.status === 401) showNoToken(); else { showWelcome(); addError(e.message); }
  }
}
init();
</script>
